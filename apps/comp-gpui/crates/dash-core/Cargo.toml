[package]
name = "dash-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "dash_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
